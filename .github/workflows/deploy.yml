name: Deploy App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate & Inject Firebase Secret
        env:
          FIREBASE_KEY_SECRET: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          set -x
          echo "=== TRACE: VALIDATING FILES ==="
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html missing!"
            exit 1
          fi
          
          if [ -z "$FIREBASE_KEY_SECRET" ]; then
            echo "ERROR: FIREBASE_API_KEY secret is missing!"
            exit 1
          fi

          echo "=== TRACE: INJECTING API KEY ==="
          sed -i 's/__FIREBASE_API_KEY__/${{ secrets.FIREBASE_API_KEY }}/g' index.html
          
          if grep -q "__FIREBASE_API_KEY__" index.html; then
            echo "ERROR: API Key injection failed!"
            exit 1
          else
            echo "SUCCESS: API Key injected."
          fi

          echo "=== TRACE: INJECTING RELEASE SHA ==="
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          sed -i "s/__RELEASE_SHA__/${SHORT_SHA}/g" index.html

          if grep -q "__RELEASE_SHA__" index.html; then
            echo "ERROR: Release SHA injection failed!"
            exit 1
          else
            echo "SUCCESS: Release SHA injected (${SHORT_SHA})."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Package site (tar keeps hidden dirs like .well-known)
        run: |
          # actions/upload-pages-artifact drops hidden files/dirs, which
          # silently omitted .well-known/assetlinks.json (the Android
          # TWA's Digital Asset Links file) from the Nov 6, 2026 deploy.
          # Package the tarball ourselves so hidden paths ship;
          # deploy-pages consumes an artifact named "github-pages"
          # containing a tar. The grep asserts assetlinks is inside —
          # a missing file fails the deploy loudly instead of 404ing.
          tar --dereference --hard-dereference -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -F "./.well-known/assetlinks.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
